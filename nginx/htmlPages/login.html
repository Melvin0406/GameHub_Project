<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GameHub Local</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f0f0; margin: 0; }
        .container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; }
        label { display: block; margin-bottom: 0.5rem; color: #555; }
        input[type="email"], input[type="password"] { width: calc(100% - 22px); padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.75rem; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        .message { text-align: center; margin-top: 1rem; padding: 0.5rem; border-radius: 4px; }
        .error { background-color: #f8d7da; color: #721c24; }
        p { text-align: center; }
        a { color: #007BFF; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Iniciar Sesión</h1>
        <form id="loginForm">
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="messageArea" class="message" style="display:none;"></div>
        <p>¿No tienes una cuenta? <a href="signup.html">Regístrate aquí</a></p>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const messageArea = document.getElementById('messageArea');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Evita el envío tradicional del formulario

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            messageArea.style.display = 'none';
            messageArea.className = 'message';

            try {
                // Nginx redirigirá /api/auth/login a tu backend Node.js
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (response.ok) {
                    // Guardar el token JWT en localStorage
                    localStorage.setItem('authToken', data.token);
                    // Opcional: guardar información del usuario si la necesitas directamente
                    // localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    // Redirigir a la página principal o al dashboard
                    window.location.href = 'index.html'; // O la página que prefieras
                } else {
                    messageArea.textContent = data.message || 'Error al iniciar sesión. Verifica tus credenciales.';
                    messageArea.classList.add('error');
                    messageArea.style.display = 'block';
                }
            } catch (error) {
                console.error('Error en el proceso de login:', error);
                messageArea.textContent = 'Ocurrió un error de red. Por favor, intenta más tarde.';
                messageArea.classList.add('error');
                messageArea.style.display = 'block';
            }
        });
    </script>
</body>
</html>
